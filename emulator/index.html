<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tribe Lord - Emulator</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #0b0b1e;
            color: #f4e9c1;
            font-family: monospace;
        }

        canvas {
            width: 720px;
            max-width: 95vw;
            aspect-ratio: 3 / 2;
            background: #000;
            border: 4px solid #3a3850;
            image-rendering: pixelated;
        }

        .toolbar {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        button {
            font: inherit;
            padding: 6px 14px;
            background: #2a2440;
            color: #f4e9c1;
            border: 2px solid #7cfc5a;
            cursor: pointer;
        }

        #status {
            color: #7cfc5a;
        }

        .keys {
            color: #6b6b80;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="240" height="160"></canvas>

    <div class="toolbar">
        <button id="reload" type="button">Reload ROM</button>
        <label><input id="auto-reload" type="checkbox" checked> Reload when rebuilt</label>
    </div>

    <div id="status">Starting emulator...</div>
    <div class="keys">Arrows: D-pad &nbsp; X: A &nbsp; Z: B &nbsp; Enter: Start &nbsp; Backspace: Select &nbsp; A/S: L/R</div>

    <script type="module">
        import mGBA from './mgba/mgba.js';

        const ROM_URL = '/tribe-lord.gba';
        const statusText = document.getElementById('status');
        const reloadButton = document.getElementById('reload');
        const autoReloadBox = document.getElementById('auto-reload');

        // The build time of the loaded ROM, used to spot a new build
        let loadedRomTime = null;

        const Module = await mGBA({ canvas: document.getElementById('canvas') });
        await Module.FSInit();

        // Always boot fresh instead of resuming, so each new build starts at the title screen
        Module.setCoreSettings({ autoSaveStateEnable: false, restoreAutoSaveStateOnLoad: false });

        // Keep the game's save file in browser storage so it survives page reloads
        Module.addCoreCallbacks({ saveDataUpdatedCallback: () => Module.FSSync() });

        async function loadRom() {
            const response = await fetch(ROM_URL, { cache: 'no-store' });
            if (!response.ok) {
                statusText.textContent = 'tribe-lord.gba not found. Run "make" in the project folder, then press Reload ROM.';
                return;
            }

            loadedRomTime = response.headers.get('Last-Modified');
            const rom = new Uint8Array(await response.arrayBuffer());
            const romPath = Module.filePaths().gamePath + '/tribe-lord.gba';

            if (Module.gameName) {
                Module.quitGame();
            }
            Module.FS.writeFile(romPath, rom);

            statusText.textContent = Module.loadGame(romPath)
                ? `Running tribe-lord.gba (built ${new Date(loadedRomTime).toLocaleTimeString()})`
                : 'The emulator could not load tribe-lord.gba.';
        }

        async function checkForNewBuild() {
            if (!autoReloadBox.checked) {
                return;
            }
            try {
                const response = await fetch(ROM_URL, { method: 'HEAD', cache: 'no-store' });
                const romTime = response.ok ? response.headers.get('Last-Modified') : null;
                if (romTime && romTime !== loadedRomTime) {
                    await loadRom();
                }
            } catch {
                statusText.textContent = 'Lost connection to the emulator server.';
            }
        }

        reloadButton.addEventListener('click', loadRom);
        setInterval(checkForNewBuild, 1000);
        await loadRom();
    </script>
</body>
</html>
